<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建词条 - 百度百科简易平台</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <style>
        .nav { margin: 10px 0; }
        .nav a { margin-right: 15px; text-decoration: none; color: #0066cc; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        textarea { height: 200px; }
        button { padding: 10px 20px; background-color: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0052a3; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="entry_list.html">词条列表</a>
        <a href="entry_form.html">创建词条</a>
    </div>
    
    <div id="app">
        <h1>{{ isEdit ? '编辑词条' : '创建词条' }}</h1>
        <form @submit.prevent="handleSubmit">
            <div class="form-group">
                <label>标题：</label>
                <input type="text" v-model="formData.title" placeholder="请输入词条标题" required>
            </div>
            <div class="form-group">
                <label>分类：</label>
                <select v-model="formData.category">
                    <option value="编程语言">编程语言</option>
                    <option value="技术">技术</option>
                    <option value="科学">科学</option>
                    <option value="历史">历史</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>内容：</label>
                <textarea v-model="formData.content" placeholder="请输入词条内容" required></textarea>
            </div>
            <button type="submit">提交</button>
            <a href="entry_list.html" style="margin-left: 15px;">取消</a>
        </form>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                isEdit: false, // 是否为编辑模式
                formData: {
                    title: '',
                    category: '编程语言',
                    content: ''
                }
            },
            methods: {
                handleSubmit() {
                    // 表单提交处理
                    console.log('提交的数据:', this.formData);
                    alert('词条提交成功！');
                    // 跳转到词条列表页面
                    window.location.href = 'entry_list.html';
                }
            },
            mounted() {
                // 检查URL参数，判断是否为编辑模式
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('edit')) {
                    this.isEdit = true;
                    // 在编辑模式下，可以加载编辑数据
                    this.formData = {
                        title: 'Python编程语言',
                        category: '编程语言',
                        content: 'Python是一种广泛使用的解释型、高级和通用的编程语言...'
                    };
                }
            }
        })
    </script>
</body>
</html>
