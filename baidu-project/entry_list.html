<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>词条列表 - 百度百科简易平台</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <style>
        .nav { margin: 10px 0; }
        .nav a { margin-right: 15px; text-decoration: none; color: #0066cc; }
        .entry-item { border: 1px solid #eee; padding: 10px; margin: 10px 0; }
        .entry-detail { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="entry_list.html">词条列表</a>
        <a href="entry_form.html">创建词条</a>
    </div>
<div id="app">
    <h1>词条列表</h1>
    <div class="entry-item" v-for="entry in entries" :key="entry.id">
        <a :href="`/entry/detail/${entry.id}/`">{{ entry.title }}</a >
        <p>分类：{{ entry.category.name }} · 创建时间：{{ entry.create_time }}</p >
    </div>
</div>
<script>
    new Vue({
        el: '#app',
        data: {
            entries: [
            {
                id: 1,
                title: "Python编程语言",
                category: { name: "编程语言" },
                create_time: "2023-06-15 10:30:00"
            },
            {
                id: 2,
                title: "JavaScript介绍",
                category: { name: "编程语言" },
                create_time: "2023-06-16 14:20:00"
            },
            {
                id: 3,
                title: "人工智能概述",
                category: { name: "技术" },
                create_time: "2023-06-17 09:15:00"
            }
        ]
    }
})
</script>
</body>
</html>
